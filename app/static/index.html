<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate Generator</title>
<style>
  :root { --ink:#1f2933; --quiet:#6b7280; --line:#d9dee5; --accent:#2563eb; --bad:#b42318; --ok:#067647; --bg:#f5f7fa; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:620px; margin:40px auto; padding:0 16px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.lead { color:var(--quiet); margin:0 0 24px; }
  form, .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:24px; }
  label { display:block; font-weight:600; margin:16px 0 6px; }
  form > label:first-child { margin-top:0; }
  input, textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; color:inherit; }
  input:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent); }
  textarea { min-height:160px; resize:vertical; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:.9rem; }
  .hint { color:var(--quiet); font-size:.85rem; margin-top:4px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .row label { margin-top:0; }
  .row { margin-top:16px; }
  @media (max-width:520px) { .row { grid-template-columns:1fr; } }
  button, a.btn { display:inline-block; margin-top:20px; padding:11px 20px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
  button:disabled { opacity:.55; cursor:default; }
  .card { margin-top:20px; }
  .bar { height:10px; background:var(--line); border-radius:99px; overflow:hidden; margin:12px 0; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .3s; }
  .stats { display:flex; gap:20px; flex-wrap:wrap; color:var(--quiet); }
  .stats b { color:var(--ink); }
  .error-box { color:var(--bad); }
  ul.problems { margin:8px 0 0; padding-left:20px; }
  ul.problems li { margin:4px 0; }
  .done { color:var(--ok); font-weight:600; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Certificate Generator</h1>
  <p class="lead">Fill in the details, paste your recipients, and get all the certificates in one ZIP.</p>

  <form id="form" novalidate>
    <label for="title">Event or course title</label>
    <input id="title" required maxlength="200" placeholder="Full-Stack Workshop 2026">

    <div class="row">
      <div>
        <label for="issuer">Issued by</label>
        <input id="issuer" required maxlength="200" placeholder="Example Tech Club">
      </div>
      <div>
        <label for="date">Date</label>
        <input id="date" type="date" required>
      </div>
    </div>

    <label for="recipients">Recipients</label>
    <textarea id="recipients" required placeholder="Asha Rao, asha@example.com&#10;Vikram Iyer, vikram@example.com"></textarea>
    <div class="hint">One person per line: <b>name, email</b> (up to 1000 lines).</div>

    <button id="submit" type="submit">Generate certificates</button>
    <div id="formError" class="error-box" hidden></div>
  </form>

  <section id="result" class="card" hidden>
    <div id="headline"><b>Working on it&hellip;</b></div>
    <div class="bar"><div id="fill"></div></div>
    <div class="stats">
      <span>Generated: <b id="nGenerated">0</b></span>
      <span>Skipped or failed: <b id="nProblems">0</b></span>
      <span>Total: <b id="nTotal">0</b></span>
    </div>
    <div id="problemsWrap" hidden>
      <p style="margin:16px 0 0"><b>These rows had a problem:</b></p>
      <ul id="problems" class="problems"></ul>
    </div>
    <a id="zip" class="btn" hidden>Download all (ZIP)</a>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
$("date").value = new Date().toISOString().slice(0, 10);

// "Asha Rao, asha@example.com" -> {name, email}. The email is whatever follows the LAST comma.
// A line with no comma is sent with only a name, and the server reports the row as invalid.
function parseRecipients(text) {
  return text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean).map((line) => {
    const i = line.lastIndexOf(",");
    if (i === -1) return { name: line };
    return { name: line.slice(0, i).trim(), email: line.slice(i + 1).trim() };
  });
}

function showFormError(msg) { $("formError").textContent = msg; $("formError").hidden = !msg; }

function describeError(body) {
  if (Array.isArray(body.detail)) {
    return body.detail.map((d) => `${d.loc.slice(1).join(".")}: ${d.msg}`).join("; ");
  }
  return body.detail || "Something went wrong.";
}

async function poll(jobId) {
  while (true) {
    const res = await fetch(`/jobs/${jobId}`);
    const job = await res.json();
    render(job);
    if (!["pending", "processing"].includes(job.status)) return job;
    await new Promise((r) => setTimeout(r, 1000));
  }
}

function render(job) {
  $("fill").style.width = job.progress_percent + "%";
  $("nGenerated").textContent = job.generated;
  $("nProblems").textContent = job.failed + job.invalid;
  $("nTotal").textContent = job.total;

  const list = $("problems");
  list.innerHTML = "";
  job.errors.forEach((e) => {
    const li = document.createElement("li");
    // textContent (not innerHTML) so names from the form can never inject HTML
    li.textContent = `Line ${e.row_index + 1}${e.recipient_name ? " (" + e.recipient_name + ")" : ""}: ${e.error}`;
    list.appendChild(li);
  });
  $("problemsWrap").hidden = job.errors.length === 0;

  const finished = !["pending", "processing"].includes(job.status);
  if (finished) {
    if (job.generated > 0) {
      $("headline").innerHTML = '<span class="done">Done.</span> Your certificates are ready.';
      $("zip").href = `/jobs/${job.job_id}/download`;
      $("zip").hidden = false;
    } else {
      $("headline").innerHTML = '<b class="error-box">No certificates could be generated.</b>';
    }
  }
}

$("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  showFormError("");
  $("zip").hidden = true;

  const recipients = parseRecipients($("recipients").value);
  if (!$("title").value.trim() || !$("issuer").value.trim() || recipients.length === 0) {
    showFormError("Please fill in the title, issuer and at least one recipient.");
    return;
  }

  $("submit").disabled = true;
  try {
    const res = await fetch("/jobs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        title: $("title").value, issuer: $("issuer").value,
        issue_date: $("date").value || undefined, recipients,
      }),
    });
    const body = await res.json();
    if (!res.ok) { showFormError(describeError(body)); return; }

    $("result").hidden = false;
    $("headline").innerHTML = "<b>Working on it&hellip;</b>";
    $("problemsWrap").hidden = true;
    $("fill").style.width = "0";
    await poll(body.job_id);
  } catch (err) {
    showFormError("Could not reach the server. Is it running?");
  } finally {
    $("submit").disabled = false;
  }
});
</script>
</body>
</html>
